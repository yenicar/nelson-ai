[project]
name = "nelson"
version = "0.1.0"
description = "Nelson AI — Account Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"` to run tests / linters.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# `pip install -e ".[scripts]"` if you want to re-run the data audit/repair
# scripts in scripts/ — those use pandas. The runtime backend does not.
scripts = [
    "pandas>=2.0",
]

[project.scripts]
nelson = "nelson.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
